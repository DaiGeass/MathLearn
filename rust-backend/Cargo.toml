[package]
name = "mathlearn-backend"
version = "0.1.0"
edition = "2021"
description = "Servidor local para MathLearn Pro"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["fs", "cors"] }
clap = { version = "4.0", features = ["derive"] }
open = "5.0"
